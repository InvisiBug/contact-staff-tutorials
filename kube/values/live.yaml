name: contact-staff-tutorials

namespace: contact-staff-tutorials
env:
  APP_VERSION: 9ed1dc0db7e1d508498a6658e5a8b44ba6305d06

deployment:
  - name: contact-staff-tutorials
    image: invisibug/contact-staff-tutorials
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

ingress:
